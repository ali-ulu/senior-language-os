name: Validate language packs

on:
  push:
    paths:
      - "packs/**"
      - "scripts/validate-packs.mjs"
      - "package.json"
      - ".github/workflows/validate-language-packs.yml"
  pull_request:
    paths:
      - "packs/**"
      - "scripts/validate-packs.mjs"
      - "package.json"
      - ".github/workflows/validate-language-packs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run validate:packs
